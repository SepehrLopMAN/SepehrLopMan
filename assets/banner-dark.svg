<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="t d">
  <title id="t">Sepehr Katebi (LopMan)</title>
  <desc id="d">Computer vision, evolutionary computation and machine learning. Animation: a grey-wolf pack encircles a moving target while a tracking box locks onto it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c232c"/>
    </pattern>
    <clipPath id="sceneclip"><rect x="600" y="22" width="376" height="216" rx="14"/></clipPath>
    <clipPath id="reveal">
      <rect x="40" y="96" width="540" height="70">
        <animate attributeName="width" from="0" to="540" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
      </rect>
    </clipPath>
    <path id="track" d="M 700 132 C 735 80, 865 76, 884 128 S 828 194, 772 172 S 664 180, 700 132 Z"/>
  </defs>
  <style>
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>

  <rect x="1" y="1" width="998" height="258" rx="18" fill="url(#bg)" stroke="#21262d"/>

  <!-- identity -->
  <text x="58" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8b949e">~/lopman<tspan fill="#3fb950"> $</tspan></text>
  <rect class="blink" x="148" y="74" width="8" height="15" fill="#3fb950"/>
  <g clip-path="url(#reveal)">
    <text x="54" y="148" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="url(#name)">Sepehr Katebi</text>
  </g>
  <text x="58" y="184" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#e6edf3" opacity="1">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.8s" fill="freeze"/>computer vision <tspan fill="#8b949e">·</tspan> evolutionary computation <tspan fill="#8b949e">·</tspan> machine learning</text>

  <!-- scene: optimisation landscape + hunt + tracking -->
  <rect x="600" y="22" width="376" height="216" rx="14" fill="#0f1620" stroke="#21262d"/>
  <g clip-path="url(#sceneclip)">
    <rect x="600" y="22" width="376" height="216" fill="url(#dots)"/>
    <g>
      <ellipse cx="792" cy="128" rx="34" ry="20" transform="rotate(-14 792 128)" fill="none" stroke="#2a3440" stroke-width="1" opacity="0.90"/>
      <ellipse cx="792" cy="128" rx="70" ry="42" transform="rotate(-14 792 128)" fill="none" stroke="#2a3440" stroke-width="1" opacity="0.78"/>
      <ellipse cx="792" cy="128" rx="108" ry="64" transform="rotate(-14 792 128)" fill="none" stroke="#2a3440" stroke-width="1" opacity="0.66"/>
      <ellipse cx="792" cy="128" rx="148" ry="88" transform="rotate(-14 792 128)" fill="none" stroke="#2a3440" stroke-width="1" opacity="0.54"/>
      <ellipse cx="792" cy="128" rx="190" ry="112" transform="rotate(-14 792 128)" fill="none" stroke="#2a3440" stroke-width="1" opacity="0.42"/>
    </g>

    <!-- tracking crosshair + box (lags the target slightly) -->
    <g>
      <animateMotion dur="12.0s" begin="-11.65s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
      <line x1="-400" y1="0" x2="400" y2="0" stroke="#3fb950" stroke-width="1" opacity="0.18"/>
      <line x1="0" y1="-300" x2="0" y2="300" stroke="#3fb950" stroke-width="1" opacity="0.18"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;0.9;1" dur="1.6s" repeatCount="indefinite"/>
        <path d="M -30 -18 V -30 H -18 M 18 -30 H 30 V -18 M 30 18 V 30 H 18 M -18 30 H -30 V 18"
          fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="-30" y="-37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#3fb950">0.98</text>
    </g>

    <!-- the pack follows the target -->
    <g>
      <animateMotion dur="12.0s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <g transform="rotate(0)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="72 0;26 0;72 0" dur="6.0s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
          <circle r="4.6" fill="#3fb950"/>
          <g transform="rotate(0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
              <text x="7" y="-7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#3fb950">α</text>
            </g>
          </g>
        </g>
      </g>
      <g transform="rotate(120)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="72 0;26 0;72 0" dur="6.4s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
          <circle r="4.6" fill="#3fb950"/>
          <g transform="rotate(-120)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
              <text x="7" y="-7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#3fb950">β</text>
            </g>
          </g>
        </g>
      </g>
      <g transform="rotate(240)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="72 0;26 0;72 0" dur="6.8s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
          <circle r="4.6" fill="#3fb950"/>
          <g transform="rotate(-240)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
              <text x="7" y="-7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#3fb950">δ</text>
            </g>
          </g>
        </g>
      </g>
      <g transform="rotate(15.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="92">
          <animate attributeName="cx" values="92;34;92" dur="5.20s" begin="0.00s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(45.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="101">
          <animate attributeName="cx" values="101;38;101" dur="5.75s" begin="5.38s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(75.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="110">
          <animate attributeName="cx" values="110;42;110" dur="6.30s" begin="5.56s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(105.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="92">
          <animate attributeName="cx" values="92;46;92" dur="6.85s" begin="5.74s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(135.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="101">
          <animate attributeName="cx" values="101;34;101" dur="7.40s" begin="5.92s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(165.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="110">
          <animate attributeName="cx" values="110;38;110" dur="5.20s" begin="3.35s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(195.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="92">
          <animate attributeName="cx" values="92;42;92" dur="5.75s" begin="3.53s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(225.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="101">
          <animate attributeName="cx" values="101;46;101" dur="6.30s" begin="3.71s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(255.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="110">
          <animate attributeName="cx" values="110;34;110" dur="6.85s" begin="3.89s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(285.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="92">
          <animate attributeName="cx" values="92;38;92" dur="7.40s" begin="4.07s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(315.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="101">
          <animate attributeName="cx" values="101;42;101" dur="5.20s" begin="1.50s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      <g transform="rotate(345.0)">
        <circle r="2.8" fill="#c9d1d9" opacity="0.78" cx="110">
          <animate attributeName="cx" values="110;46;110" dur="5.75s" begin="1.68s"
            repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        </circle>
      </g>
      </g>
      <circle r="4" fill="none" stroke="#f2a93b" stroke-width="1.5">
        <animate attributeName="r" values="4;15" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.6" fill="#f2a93b"/>
    </g>

    <!-- HUD -->
    <circle class="blink" cx="618" cy="40" r="3.5" fill="#f85149"/>
    <text x="628" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">TRACKING</text>
    <text x="962" y="44" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">17 fps</text>
    <text x="962" y="226" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">argmin f(x)</text>
  </g>
</svg>
